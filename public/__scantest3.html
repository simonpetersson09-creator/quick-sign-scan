<!doctype html><html><body><script type="module">
import * as P from '/src/lib/perspective.ts';
window.run3=async()=>{
 const img=new Image(); img.src='/__scantest.jpg'; await img.decode();
 const DW=280,DH=Math.round(DW*img.naturalHeight/img.naturalWidth);
 const c=document.createElement('canvas');c.width=DW;c.height=DH;
 const cx=c.getContext('2d',{willReadFrequently:true});cx.drawImage(img,0,0,DW,DH);
 const d=cx.getImageData(0,0,DW,DH).data;
 let s=0,mn=255,mx=0; const hist=new Array(8).fill(0);
 for(let i=0;i<d.length;i+=4){const l=(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2])|0;s+=l;if(l<mn)mn=l;if(l>mx)mx=l;hist[l>>5]++;}
 const n=d.length/4;
 const paper=P.detectPaperByThreshold(cx.canvas ? cx : cx, DW, DH);
 return {meanLum:+(s/n).toFixed(1),mn,mx,hist, paperType:typeof paper, paper: paper && paper.map? paper.map(p=>[+ (p.x/DW).toFixed(3),+(p.y/DH).toFixed(3)]) : paper};
};
window.ready3=true;
</script></body></html>
